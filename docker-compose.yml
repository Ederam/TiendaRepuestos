version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: tienda_repuestos_db
    environment:
      POSTGRES_DB: pos_repuestos_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: DevPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: